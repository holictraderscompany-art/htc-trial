name: HTC one-shot Cloudflare TEST deployment
# Founder confirmed the narrow TEST callback entry saved on 23 October 2026.
# Exact-SHA enablement and all cloud tests still precede any Worker upload.
# Reviewed one-shot access-check continuation; credential guards remain unchanged.
on:
  push:
    branches: [codex/cloudflare-workers-preparation]
    paths:
      - .github/workflows/cloudflare-test-deploy.yml
      - validation/cloudflare/deploy-test.mjs
      - validation/cloudflare/deploy-test.test.mjs
      - cloudflare/**
      - tests/cloudflare-redirect-error.test.mjs
      - tests/cloudflare-test-access-check.test.mjs
      - validation/cloudflare/*redirect*workerd*
permissions:
  contents: read
concurrency:
  group: htc-cloudflare-test-one-shot
  cancel-in-progress: false
jobs:
  test-only:
    if: >-
      github.repository == 'holictraderscompany-art/htc-trial' &&
      github.ref == 'refs/heads/codex/cloudflare-workers-preparation' &&
      github.run_attempt == 1 &&
      (contains(github.event.head_commit.message, '[HTC-TEST-DEPLOY]') ||
       contains(github.event.head_commit.message, '[HTC-TEST-PACKAGE]') ||
       contains(github.event.head_commit.message, '[HTC-TEST-REDIRECT-FIX]') ||
       contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]'))
    environment: cloudflare-test
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]') && 60 || 30 }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      WRANGLER_LOG_SANITIZE: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      HTC_SUPABASE_TARGET: test
      SUPABASE_URL: https://uzhkzhmncxjplrdtdzgd.supabase.co
      TEST_EXECUTION_MODE: ${{ contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]') && 'accesscheck' || contains(github.event.head_commit.message, '[HTC-TEST-REDIRECT-FIX]') && 'repair' || contains(github.event.head_commit.message, '[HTC-TEST-DEPLOY]') && 'deploy' || 'package' }}
      APPROVED_REPAIR_BASE_VERSION: a101e9e0-d84f-4473-9867-1475126b0c9e
      APPROVED_ACCESSCHECK_BASE_VERSION: f2897ae4-6133-4614-aaa8-257e3f5c6216
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Cloud-only controller guard regression
        run: |
          node --test validation/cloudflare/deploy-test.test.mjs
          if [ "$TEST_EXECUTION_MODE" = repair ]; then node --test tests/cloudflare-redirect-error.test.mjs; fi
          if [ "$TEST_EXECUTION_MODE" = accesscheck ]; then node --test tests/cloudflare-redirect-error.test.mjs tests/cloudflare-test-access-check.test.mjs; fi
      - name: Wait once for the verified remaining-lifetime window without credentials
        if: contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]')
        env:
          APPROVED_WORKFLOW_SHA: ${{ vars.HTC_TEST_APPROVED_WORKFLOW_SHA }}
        run: |
          node --input-type=module <<'NODE'
          const guard=(ok,code)=>{if(!ok)throw Error(code);};
          guard(process.env.GITHUB_ACTIONS==='true'&&process.env.RUNNER_OS==='Linux'&&process.env.RUNNER_ENVIRONMENT==='github-hosted'&&process.version==='v24.21.0','STOP_WINDOW_RUNNER');
          guard(process.env.GITHUB_REPOSITORY==='holictraderscompany-art/htc-trial'&&process.env.GITHUB_REF==='refs/heads/codex/cloudflare-workers-preparation'&&process.env.GITHUB_RUN_ATTEMPT==='1'&&/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA??'')&&process.env.APPROVED_WORKFLOW_SHA===process.env.GITHUB_SHA,'STOP_WINDOW_APPROVAL');
          for(const key of ['CLOUDFLARE_TEST_API_TOKEN','CLOUDFLARE_TEST_ACCESSCHECK_API_TOKEN','HTC_SUPABASE_TEST_PUBLISHABLE_KEY'])guard(process.env[key]===undefined,'STOP_WINDOW_CREDENTIAL');
          const started=new Date().toISOString(),notBefore=Date.parse('2026-10-24T03:00:00Z');
          const delay=Math.max(0,notBefore-Date.now());
          guard(Number.isFinite(delay)&&delay<=1800000,'STOP_WINDOW_DELAY');
          console.log(JSON.stringify({status:'WAIT_ONCE_NO_CREDENTIALS',started,notBeforeUTC:new Date(notBefore).toISOString(),delayMilliseconds:delay,requests:0,mutations:0,deployments:0}));
          if(delay>0)await new Promise(resolve=>setTimeout(resolve,delay));
          guard(Date.now()>=notBefore,'STOP_WINDOW_CLOCK');
          console.log(JSON.stringify({status:'WINDOW_OPEN_PREFLIGHT_STILL_REQUIRED',sha:process.env.GITHUB_SHA,finished:new Date().toISOString(),requests:0,mutations:0,deployments:0}));
          NODE
      - name: Read-only access and sealed-source preflight
        env:
          APPROVED_WORKFLOW_SHA: ${{ vars.HTC_TEST_APPROVED_WORKFLOW_SHA }}
          DEPLOYMENT_ENABLED: ${{ vars.HTC_TEST_DEPLOYMENT_ENABLED }}
          REDIRECT_ALLOWLIST_VERIFIED: ${{ vars.HTC_TEST_REDIRECT_ALLOWLIST_VERIFIED }}
          CONFIG_CF_ACCOUNT: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CONFIG_WORKER: ${{ vars.CLOUDFLARE_TEST_WORKER_NAME }}
          CONFIG_PROJECT: ${{ vars.HTC_SUPABASE_TEST_PROJECT_REF }}
          CLOUDFLARE_TEST_API_TOKEN: ${{ contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]') && (secrets.CLOUDFLARE_TEST_ACCESSCHECK_API_TOKEN || 'UNAVAILABLE') || secrets.CLOUDFLARE_TEST_API_TOKEN }}
          HTC_SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.HTC_SUPABASE_TEST_PUBLISHABLE_KEY }}
        run: node validation/cloudflare/deploy-test.mjs preflight
      - name: Frozen install and OpenNext build without live credentials
        env:
          APPROVED_WORKFLOW_SHA: ${{ vars.HTC_TEST_APPROVED_WORKFLOW_SHA }}
          DEPLOYMENT_ENABLED: ${{ vars.HTC_TEST_DEPLOYMENT_ENABLED }}
          REDIRECT_ALLOWLIST_VERIFIED: ${{ vars.HTC_TEST_REDIRECT_ALLOWLIST_VERIFIED }}
          CONFIG_CF_ACCOUNT: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CONFIG_WORKER: ${{ vars.CLOUDFLARE_TEST_WORKER_NAME }}
          CONFIG_PROJECT: ${{ vars.HTC_SUPABASE_TEST_PROJECT_REF }}
          CLOUDFLARE_TEST_API_TOKEN: ${{ contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]') && secrets.CLOUDFLARE_TEST_ACCESSCHECK_API_TOKEN || '' }}
          HTC_SUPABASE_TEST_PUBLISHABLE_KEY: ${{ contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]') && secrets.HTC_SUPABASE_TEST_PUBLISHABLE_KEY || '' }}
        run: node validation/cloudflare/deploy-test.mjs build
      - name: One TEST deployment followed by non-mutating HTTPS checks
        if: contains(github.event.head_commit.message, '[HTC-TEST-DEPLOY]') || contains(github.event.head_commit.message, '[HTC-TEST-REDIRECT-FIX]') || contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]')
        env:
          APPROVED_WORKFLOW_SHA: ${{ vars.HTC_TEST_APPROVED_WORKFLOW_SHA }}
          DEPLOYMENT_ENABLED: ${{ vars.HTC_TEST_DEPLOYMENT_ENABLED }}
          REDIRECT_ALLOWLIST_VERIFIED: ${{ vars.HTC_TEST_REDIRECT_ALLOWLIST_VERIFIED }}
          CONFIG_CF_ACCOUNT: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
          CONFIG_WORKER: ${{ vars.CLOUDFLARE_TEST_WORKER_NAME }}
          CONFIG_PROJECT: ${{ vars.HTC_SUPABASE_TEST_PROJECT_REF }}
          CLOUDFLARE_TEST_API_TOKEN: ${{ contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-CHECK]') && (secrets.CLOUDFLARE_TEST_ACCESSCHECK_API_TOKEN || 'UNAVAILABLE') || secrets.CLOUDFLARE_TEST_API_TOKEN }}
          HTC_SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.HTC_SUPABASE_TEST_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_secret_file="$RUNNER_TEMP/htc-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          trap 'rm -f -- "$runtime_secret_file"' EXIT HUP INT TERM
          node validation/cloudflare/deploy-test.mjs deploy
      - name: Install isolated cloud Chromium after the corrective upload
        if: contains(github.event.head_commit.message, '[HTC-TEST-REDIRECT-FIX]')
        run: pnpm exec playwright install chromium
      - name: Verify actual public database read and responsive UI without replaying passed HTTP probes
        if: contains(github.event.head_commit.message, '[HTC-TEST-REDIRECT-FIX]')
        env:
          HTC_DEPLOY_REPORT: .wrangler/htc-test-deployment/deploy-report.json
        run: node validation/cloudflare/probe-deployed-ui.mjs
