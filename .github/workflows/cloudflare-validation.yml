name: HTC Cloudflare cloud validation (no deployment)
on:
  push:
    branches: [codex/cloudflare-workers-preparation]
    paths:
      - .github/workflows/cloudflare-validation.yml
      - package.json
      - pnpm-lock.yaml
      - wrangler.jsonc
      - open-next.config.ts
      - next.config.mjs
      - tests/cloudflare-config.test.mjs
      - validation/cloudflare/cloud-validate.mjs
      - validation/cloudflare/probe-local-worker.mjs
      - validation/cloudflare/probe-worker-ui.mjs
permissions:
  contents: read
concurrency:
  group: htc-workers-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'holictraderscompany-art/htc-trial' && github.ref == 'refs/heads/codex/cloudflare-workers-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
      HTC_SUPABASE_TARGET: test
      SUPABASE_URL: https://uzhkzhmncxjplrdtdzgd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_worker_runtime_fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Cloud-only install, build, security and runtime validation
        run: node validation/cloudflare/cloud-validate.mjs --reuse-regressions
