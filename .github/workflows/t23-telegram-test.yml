name: T23 Telegram TEST preflight

# GitHub discovers workflow_dispatch on main. Select codex/group04-t18
# when dispatching. The environment and this job both enforce that ref.
on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-test-bot:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'holictraderscompany-art/htc-trial' && github.ref == 'refs/heads/codex/group04-t18' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: htc-telegram-test
    steps:
      - name: Verify Telegram TEST bot identity
        shell: bash
        env:
          HTC_TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.HTC_TELEGRAM_TEST_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          async function verifyBot() {
            const token = process.env.HTC_TELEGRAM_TEST_BOT_TOKEN;
            if (!/^\d{1,20}:[A-Za-z0-9_-]{20,128}$/.test(token ?? '')) {
              return 'TOKEN_MISSING_OR_INVALID';
            }

            try {
              const response = await fetch('https://api.telegram.org/bot' + token + '/getMe', {
                redirect: 'error',
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) return 'TELEGRAM_HTTP_FAILURE';

              const data = await response.json();
              if (data?.ok !== true) return 'TELEGRAM_API_FAILURE';
              const bot = data.result;
              if (bot?.is_bot !== true || typeof bot.username !== 'string' ||
                  bot.username.toLowerCase() !== 'htct23testbot') {
                return 'UNEXPECTED_BOT_IDENTITY';
              }
              return 'TEST_BOT_IDENTITY_VERIFIED';
            } catch {
              return 'TELEGRAM_REQUEST_FAILURE';
            }
          }

          const result = await verifyBot();
          console.log(result);
          if (result !== 'TEST_BOT_IDENTITY_VERIFIED') process.exitCode = 1;
          NODE
