name: HTC TEST diagnostic page cloud validation (no deployment)
on:
  push:
    branches: [codex/cloudflare-workers-preparation]
    paths:
      - .github/workflows/cloudflare-test-access-validation.yml
      - cloudflare/test-access-check.mjs
      - cloudflare/worker-entry.mjs
      - tests/cloudflare-test-access-check.test.mjs
      - validation/cloudflare/deploy-test.mjs
      - validation/cloudflare/deploy-test.test.mjs
      - validation/cloudflare/probe-test-access-check.mjs
permissions:
  contents: read
concurrency:
  group: htc-test-access-validation
  cancel-in-progress: false
jobs:
  diagnostic-only:
    if: >-
      github.repository == 'holictraderscompany-art/htc-trial' &&
      github.ref == 'refs/heads/codex/cloudflare-workers-preparation' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[HTC-TEST-ACCESS-VALIDATE]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Verify sealed source and exact TEST branch without live credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {target,verifyHost} from './validation/cloudflare/test-deployment-preflight.mjs';
          import {verifyDeploymentChanges} from './validation/cloudflare/deploy-test.mjs';
          verifyHost(process.env,process.platform,process.version);
          assert.equal(process.env.RUNNER_ENVIRONMENT,'github-hosted');
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const bytes=p=>execFileSync('git',['show',`HEAD:${p}`]);
          const digest=b=>createHash('sha256').update(b).digest('hex');
          assert.equal(git('rev-parse','HEAD'),process.env.GITHUB_SHA);
          assert.equal(git('status','--porcelain=v1'),'');
          git('merge-base','--is-ancestor','946c4e7ac17ff9fef2c82a69995c58f17b93a0e1','HEAD');
          verifyDeploymentChanges(git('diff','--name-status',target.migration,'HEAD'));
          const manifestBytes=bytes('validation/cloudflare/final-review.json');
          assert.equal(digest(manifestBytes),target.manifestSHA256);
          const manifest=JSON.parse(manifestBytes);assert.equal(manifest.files.length,22);
          for(const f of manifest.files){assert.equal(digest(bytes(f.path)),f.sha256);assert.equal(git('rev-parse',`HEAD:${f.path}`),f.gitBlobOID);}
          assert.equal(digest(bytes('pnpm-lock.yaml')),target.lockSHA256);
          for(const n of ['CLOUDFLARE_TEST_API_TOKEN','CLOUDFLARE_TEST_ACCESSCHECK_API_TOKEN','HTC_SUPABASE_TEST_PUBLISHABLE_KEY','SUPABASE_SERVICE_ROLE_KEY'])assert.equal(process.env[n],undefined);
          console.log('SEALED_23_FILES_AND_LOCK_PASS_NO_LIVE_CREDENTIALS');
          NODE
      - name: Focused controller, adapter and synthetic diagnostic security tests
        run: node --test validation/cloudflare/deploy-test.test.mjs tests/cloudflare-redirect-error.test.mjs tests/cloudflare-test-access-check.test.mjs
      - name: Frozen cloud dependencies with existing security policy
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated cloud Chromium
        run: pnpm exec playwright install chromium
      - name: Test browser controls, CSP and strict Origin without live authentication
        run: node validation/cloudflare/probe-test-access-check.mjs
